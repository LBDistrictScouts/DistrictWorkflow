services:
  aws-local:
    image: motoserver/moto:5.2.1
    profiles: ['aws-local']
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      MOTO_PORT: '4566'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4566/moto-api/')"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: district_workflow
      POSTGRES_USER: district
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - application_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U district -d district_workflow']
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: district_test
      POSTGRES_PASSWORD: test-only
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U district_test -d postgres']
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  application_postgres:
