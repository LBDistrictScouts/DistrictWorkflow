name: Anti-slop

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint:anti-slop
